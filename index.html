<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏓 Table Tennis Professional Scoreboard</title>
    <!-- SheetJS for Exporting Excel Files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF8F0;
            --card-bg: #FFFFFF;
            --text-color: #282828;
            --p1-color: #FF5A5A;
            --p2-color: #3C96FF;
            --accent-color: #FFC864;
            --serve-color: #FF8C00;
            --pause-color: #DC3232;
            --wtt-bg: #0F172A;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1000px;
        }

        button {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid var(--text-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #E0E0E0;
        }

        button:disabled {
            background-color: #D6D6D6;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-accent { background-color: var(--accent-color); }
        .btn-yellow { background-color: #F5C81E; }
        .btn-red { background-color: #EB3232; color: white; }

        /* Match Info Bar */
        .match-info {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Main Scoreboard Layout */
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            position: relative;
        }

        .card {
            background: var(--card-bg);
            border: 3px solid var(--text-color);
            border-radius: 20px;
            width: 420px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 40px;
        }

        .cards-display {
            display: flex;
            gap: 5px;
        }

        .penalty-card {
            width: 20px;
            height: 30px;
            border-radius: 4px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .serve-badge {
            background-color: var(--serve-color);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 14px;
            visibility: hidden;
        }

        .serve-badge.active { visibility: visible; }

        .player-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
        }

        /* 大尺寸國旗/Emoji 按鈕 */
        .btn-emoji-select {
            padding: 0;
            border: 2px solid var(--text-color);
            border-radius: 8px;
            background-color: #F8F8F8;
            cursor: pointer;
            width: 56px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            overflow: hidden;
            font-size: 26px;
        }

        .btn-emoji-select:hover {
            background-color: #E8E8E8;
            transform: scale(1.08);
        }

        .btn-emoji-select img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        .player-name {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 8px;
        }

        .player-name:hover { background-color: #F0F0F0; }

        .score-box {
            background-color: #F5F5F5;
            border: 2px solid #C8C8C8;
            border-radius: 15px;
            width: 220px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .p1-score { color: var(--p1-color); }
        .p2-score { color: var(--p2-color); }

        .control-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .vs-label {
            font-size: 48px;
            font-weight: bold;
        }

        /* Banners */
        .banner {
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            display: none;
            text-align: center;
            max-width: 800px;
        }

        .wtt-banner {
            background-color: var(--wtt-bg);
            color: white;
            border: 2px solid var(--serve-color);
        }

        .win-banner {
            background-color: #FFE196;
            color: #B43200;
            border: 2px solid #E6AA00;
            font-size: 24px;
        }

        /* Overlays & Modals */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .timeout-modal {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 5px solid var(--pause-color);
            text-align: center;
            width: 400px;
        }

        /* Emoji / 國旗選單與搜尋 */
        .emoji-modal {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 3px solid var(--text-color);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        .emoji-search-input {
            width: 90%;
            padding: 10px 14px;
            font-size: 16px;
            border: 2px solid #CCC;
            border-radius: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        .emoji-search-input:focus {
            border-color: var(--p2-color);
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 10px 0;
            max-height: 280px;
            overflow-y: auto;
            padding: 5px;
        }

        .emoji-item {
            height: 45px;
            border-radius: 8px;
            border: 1px solid #DDD;
            cursor: pointer;
            background: #FAF8F0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.1s;
            overflow: hidden;
        }

        .emoji-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        .emoji-item:hover {
            background: #E0E0E0;
            transform: scale(1.15);
        }

        .watermark {
            margin-top: 30px;
            color: #969696;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <button id="btn-voice" onclick="toggleVoice()">🔊 Voice: English</button>
        <button id="btn-say-name" onclick="toggleSayName()">🗣️ Announce Names: ON</button>
        <button id="btn-say-swap" onclick="toggleSaySwap()">🔄 Switch Sides Alert: ON</button>
        <button onclick="editPlayerNames()">✏️ Edit Names</button>
        <button id="btn-switch-serve" class="btn-accent" onclick="manualSwitchServe()" style="display:none;">🏓 Switch Serve</button>
        <button id="btn-pause" onclick="togglePause()">⏸️ Pause Timer</button>
        <button class="btn-accent" onclick="exportExcel()">📊 Export Excel</button>
    </div>

    <!-- Match Info -->
    <div class="match-info">
        <span id="match-timer">Time: 00:00</span> | 
        <span id="game-info">Game 1 (Best of 5) | Total Games (0 : 0)</span>
    </div>

    <!-- Main Scoreboard -->
    <div class="scoreboard">
        <!-- Player 1 Card -->
        <div class="card">
            <div class="card-header">
                <div class="cards-display" id="p1-cards"></div>
                <div class="serve-badge" id="p1-serve">🏓 SERVING</div>
            </div>
            <div class="player-row">
                <button class="btn-emoji-select" id="p1-emoji-btn" onclick="openEmojiPicker(1)" title="選擇旗幟 / Emoji">🏓</button>
                <div class="player-name" id="p1-name-display" onclick="editSingleName(1)">Player 1</div>
            </div>
            <div class="score-box p1-score" onclick="addScore(1)" id="p1-score-display">0</div>
            <div class="control-btns">
                <button onclick="addScore(1)">+1 (←)</button>
                <button onclick="subScore(1)">-1 (↑)</button>
            </div>
            <div class="control-btns">
                <button id="p1-timeout-btn" onclick="triggerTimeout(1)">⏸️ Timeout (1)</button>
                <button id="p1-challenge-btn" onclick="useChallenge(1)">👁️ Challenge (2)</button>
                <button class="btn-yellow" onclick="issueCard(1, 'yellow')">🟨</button>
                <button class="btn-red" onclick="issueCard(1, 'red')">🟥</button>
            </div>
        </div>

        <div class="vs-label">VS</div>

        <!-- Player 2 Card -->
        <div class="card">
            <div class="card-header">
                <div class="cards-display" id="p2-cards"></div>
                <div class="serve-badge" id="p2-serve">🏓 SERVING</div>
            </div>
            <div class="player-row">
                <button class="btn-emoji-select" id="p2-emoji-btn" onclick="openEmojiPicker(2)" title="選擇旗幟 / Emoji">🏓</button>
                <div class="player-name" id="p2-name-display" onclick="editSingleName(2)">Player 2</div>
            </div>
            <div class="score-box p2-score" onclick="addScore(2)" id="p2-score-display">0</div>
            <div class="control-btns">
                <button onclick="addScore(2)">+1 (→)</button>
                <button onclick="subScore(2)">-1 (↓)</button>
            </div>
            <div class="control-btns">
                <button id="p2-timeout-btn" onclick="triggerTimeout(2)">⏸️ Timeout (1)</button>
                <button id="p2-challenge-btn" onclick="useChallenge(2)">👁️ Challenge (2)</button>
                <button class="btn-yellow" onclick="issueCard(2, 'yellow')">🟨</button>
                <button class="btn-red" onclick="issueCard(2, 'red')">🟥</button>
            </div>
        </div>
    </div>

    <!-- Banners -->
    <div id="wtt-banner" class="banner wtt-banner"></div>
    <div id="win-banner" class="banner win-banner"></div>

    <!-- Watermark -->
    <div class="watermark">MADE BY RAGEN CHEUNG, DO NOT SEND TO OTHERS. 不得轉發。</div>

    <!-- Timeout Modal -->
    <div class="overlay" id="timeout-overlay">
        <div class="timeout-modal">
            <h1 style="color: var(--pause-color); margin-top:0;">⏱️ TIMEOUT</h1>
            <p id="timeout-player-text" style="font-size: 18px; font-weight: bold;"></p>
            <div id="timeout-timer" style="font-size: 70px; font-weight: bold; margin: 20px 0;">60s</div>
            <button class="btn-accent" style="font-size: 18px; padding: 10px 20px;" onclick="finishTimeout()">Resume Game</button>
        </div>
    </div>

    <!-- Emoji / Flag Picker Overlay -->
    <div class="overlay" id="emoji-overlay">
        <div class="emoji-modal">
            <h3 style="margin-top:0; margin-bottom: 10px;">選擇旗幟 / Emoji</h3>
            <input type="text" id="emoji-search" class="emoji-search-input" placeholder="🔍 搜尋（例如：台灣、日本、馬來西亞、火）" oninput="filterEmojis()">
            <div class="emoji-grid" id="emoji-grid"></div>
            <div style="margin-top: 10px;">
                <button onclick="customEmojiInput()" style="margin-right: 5px;">輸入自訂 Emoji</button>
                <button onclick="closeEmojiPicker()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // Setup Parameters
        let bestOfSets = parseInt(prompt("Best of how many games? (e.g. 5)", "5")) || 5;
        let totalSetsToWin = Math.floor(bestOfSets / 2) + 1;
        let maxTimeouts = parseInt(prompt("Timeouts per player:", "1")) || 1;
        let maxChallenges = parseInt(prompt("Challenges per player:", "2")) || 2;

        let p1Name = "Player 1", p2Name = "Player 2";
        let p1Item = { type: 'emoji', value: '🏓' };
        let p2Item = { type: 'emoji', value: '🏓' };
        let activeEmojiPlayer = null;

        let scoreP1 = 0, scoreP2 = 0;
        let setsP1 = 0, setsP2 = 0;
        let currentGame = 1;
        let firstServer = 1, currentServer = 1;

        let p1Timeouts = maxTimeouts, p2Timeouts = maxTimeouts;
        let p1Challenges = maxChallenges, p2Challenges = maxChallenges;

        let p1FoulCount = 0, p2FoulCount = 0;
        let p1Yellow = 0, p1Red = 0, p2Yellow = 0, p2Red = 0;

        let isPaused = false;
        let matchStartTime = Date.now(), accumulatedPauseTime = 0, pauseStartTime = 0;
        let gameStartTime = Date.now();

        let pointHistory = [];
        let matchHistory = [];
        let gameOver = false, matchOver = false;

        let voiceMode = "english"; 
        let sayPlayerName = true;
        let saySwapVoice = true;

        let timeoutInterval = null, timeoutRemaining = 60;

        // 使用 Data URI 格式的 SVG 奧會旗 (完全免外部載入，絕不破圖)
        const tpeFlagSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'><rect width='900' height='600' fill='white'/><path d='M450,110 C500,110 520,150 560,160 C600,170 630,130 660,170 C690,210 660,250 680,290 C700,330 740,350 730,400 C720,450 670,460 650,500 C630,540 580,520 540,540 C500,560 470,510 450,510 C430,510 400,560 360,540 C320,520 270,540 250,500 C230,460 180,450 170,400 C160,350 200,330 220,290 C240,250 210,210 240,170 C270,130 300,170 340,160 C380,150 400,110 450,110 Z' fill='none' stroke='%23000099' stroke-width='14'/><path d='M450,125 C495,125 512,162 550,172 C588,182 615,145 642,182 C670,220 642,258 660,295 C678,332 715,350 706,396 C697,442 650,452 632,490 C615,528 568,509 530,528 C492,546 465,500 450,500 C435,500 408,546 370,528 C332,509 285,528 268,490 C250,452 203,442 194,396 C185,350 222,332 240,295 C258,258 230,220 258,182 C285,145 312,182 350,172 C388,162 405,125 450,125 Z' fill='none' stroke='%23DD0000' stroke-width='10'/><path d='M450,140 C490,140 505,175 540,185 C575,195 600,160 625,195 C650,230 625,265 640,300 C655,335 690,350 682,392 C675,434 630,444 615,480 C600,515 556,498 520,516 C484,533 460,490 450,490 C440,490 416,533 380,516 C344,498 300,515 285,480 C270,444 225,434 218,392 C210,350 245,335 260,300 C275,265 250,230 275,195 C300,160 325,195 360,185 C395,175 410,140 450,140 Z' fill='none' stroke='%23000099' stroke-width='10'/><circle cx='450' cy='230' r='35' fill='%23000099'/><g fill='%23000099'><polygon points='450,180 457,210 480,190 467,217 497,213 473,230 500,245 471,243 487,268 463,248 462,278 450,250 438,278 437,248 413,268 429,243 400,245 427,230 403,213 433,217 420,190 443,210'/></g><circle cx='450' cy='230' r='20' fill='white'/><circle cx='450' cy='230' r='16' fill='%23000099'/><g fill='none' stroke-width='7'><circle cx='370' cy='360' r='30' stroke='%230081C8'/><circle cx='450' cy='360' r='30' stroke='black'/><circle cx='530' cy='360' r='30' stroke='%23EE334E'/><circle cx='410' cy='390' r='30' stroke='%23FCB131'/><circle cx='490' cy='390' r='30' stroke='%2300A651'/></g></svg>";

        // 國家/地區旗幟清單（含新增加的 5 個國家）
        const flagList = [
            { code: 'tw', name: '中華台北/台灣', keywords: '台灣 中華台北 奧會旗 taiwan chinese taipei tpe', url: tpeFlagSvg },
            { code: 'jp', name: '日本', keywords: '日本 japan', url: 'https://flagcdn.com/w160/jp.png' },
            { code: 'cn', name: '中國', keywords: '中國 china', url: 'https://flagcdn.com/w160/cn.png' },
            { code: 'hk', name: '香港', keywords: '香港 hong kong', url: 'https://flagcdn.com/w160/hk.png' },
            { code: 'mo', name: '澳門', keywords: '澳門 macao macau', url: 'https://flagcdn.com/w160/mo.png' },
            { code: 'kr', name: '韓國', keywords: '韓國 南韓 korea', url: 'https://flagcdn.com/w160/kr.png' },
            { code: 'de', name: '德國', keywords: '德國 germany', url: 'https://flagcdn.com/w160/de.png' },
            { code: 'fr', name: '法國', keywords: '法國 france', url: 'https://flagcdn.com/w160/fr.png' },
            { code: 'se', name: '瑞典', keywords: '瑞典 sweden', url: 'https://flagcdn.com/w160/se.png' },
            { code: 'br', name: '巴西', keywords: '巴西 brazil', url: 'https://flagcdn.com/w160/br.png' },
            { code: 'us', name: '美國', keywords: '美國 usa america', url: 'https://flagcdn.com/w160/us.png' },
            { code: 'eg', name: '埃及', keywords: '埃及 egypt', url: 'https://flagcdn.com/w160/eg.png' },
            { code: 'gb-eng', name: '英格蘭', keywords: '英格蘭 英國 england', url: 'https://flagcdn.com/w160/gb-eng.png' },
            { code: 'ca', name: '加拿大', keywords: '加拿大 canada', url: 'https://flagcdn.com/w160/ca.png' },
            { code: 'kp', name: '北韓', keywords: '北韓 朝鮮 north korea', url: 'https://flagcdn.com/w160/kp.png' },
            { code: 'pt', name: '葡萄牙', keywords: '葡萄牙 portugal', url: 'https://flagcdn.com/w160/pt.png' },
            { code: 'au', name: '澳洲', keywords: '澳洲 澳大利亞 australia', url: 'https://flagcdn.com/w160/au.png' },
            { code: 'it', name: '義大利', keywords: '義大利 italy', url: 'https://flagcdn.com/w160/it.png' },
            { code: 'nz', name: '紐西蘭', keywords: '紐西蘭 new zealand', url: 'https://flagcdn.com/w160/nz.png' },
            { code: 'be', name: '比利時', keywords: '比利時 belgium', url: 'https://flagcdn.com/w160/be.png' },
            { code: 'in', name: '印度', keywords: '印度 india', url: 'https://flagcdn.com/w160/in.png' },
            { code: 'sg', name: '新加坡', keywords: '新加坡 singapore', url: 'https://flagcdn.com/w160/sg.png' },
            { code: 'th', name: '泰國', keywords: '泰國 thailand', url: 'https://flagcdn.com/w160/th.png' },
            { code: 'pl', name: '波蘭', keywords: '波蘭 poland', url: 'https://flagcdn.com/w160/pl.png' },
            { code: 'dk', name: '丹麥', keywords: '丹麥 denmark', url: 'https://flagcdn.com/w160/dk.png' },
            // 新增國家
            { code: 'my', name: '馬來西亞', keywords: '馬來西亞 大馬 malaysia my', url: 'https://flagcdn.com/w160/my.png' },
            { code: 'es', name: '西班牙', keywords: '西班牙 spain es', url: 'https://flagcdn.com/w160/es.png' },
            { code: 'nl', name: '荷蘭', keywords: '荷蘭 netherlands holland nl', url: 'https://flagcdn.com/w160/nl.png' },
            { code: 'ar', name: '阿根廷', keywords: '阿根廷 argentina ar', url: 'https://flagcdn.com/w160/ar.png' },
            { code: 'ru', name: '俄羅斯', keywords: '俄羅斯 russia ru', url: 'https://flagcdn.com/w160/ru.png' }
        ];

        const emojiList = [
            { type: 'emoji', value: '🏓', keywords: '乒乓球 桌球 pingpong' },
            { type: 'emoji', value: '🥇', keywords: '金牌 第一 gold' },
            { type: 'emoji', value: '🔥', keywords: '火 熱情 fire' },
            { type: 'emoji', value: '⚡', keywords: '閃電 lightning' },
            { type: 'emoji', value: '⭐', keywords: '星星 star' },
            { type: 'emoji', value: '👑', keywords: '皇冠 國王 crown' },
            { type: 'emoji', value: '🎯', keywords: '靶心 target' },
            { type: 'emoji', value: '🏆', keywords: '獎盃 trophy' },
            { type: 'emoji', value: '💪', keywords: '力量 muscle' },
            { type: 'emoji', value: '😎', keywords: '酷 cool' }
        ];

        const masterList = [
            ...flagList.map(f => ({
                type: 'flag',
                value: f.code,
                url: f.url,
                keywords: f.keywords
            })),
            ...emojiList
        ];

        function openEmojiPicker(player) {
            activeEmojiPlayer = player;
            document.getElementById("emoji-search").value = "";
            renderEmojiGrid(masterList);
            document.getElementById("emoji-overlay").style.display = "flex";
        }

        function closeEmojiPicker() {
            document.getElementById("emoji-overlay").style.display = "none";
            activeEmojiPlayer = null;
        }

        function renderEmojiGrid(items) {
            let grid = document.getElementById("emoji-grid");
            grid.innerHTML = "";
            items.forEach(item => {
                let div = document.createElement("div");
                div.className = "emoji-item";
                if (item.type === 'flag') {
                    let img = document.createElement("img");
                    img.src = item.url;
                    img.alt = item.keywords;
                    div.appendChild(img);
                } else {
                    div.innerText = item.value;
                }
                div.title = item.keywords;
                div.onclick = () => selectItem(item);
                grid.appendChild(div);
            });
        }

        function filterEmojis() {
            let query = document.getElementById("emoji-search").value.toLowerCase().trim();
            if (!query) {
                renderEmojiGrid(masterList);
                return;
            }
            let filtered = masterList.filter(item => item.keywords.toLowerCase().includes(query));
            renderEmojiGrid(filtered);
        }

        function selectItem(item) {
            if (activeEmojiPlayer === 1) p1Item = item;
            else if (activeEmojiPlayer === 2) p2Item = item;
            closeEmojiPicker();
            updateUI();
        }

        function customEmojiInput() {
            let input = prompt("請輸入自訂 Emoji：");
            if (input) selectItem({ type: 'emoji', value: input.trim(), keywords: 'custom' });
        }

        function speak(text) {
            if (voiceMode === "off" || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = voiceMode === "cantonese" ? "zh-HK" : "en-US";
            window.speechSynthesis.speak(msg);
        }

        function announceScore() {
            if (voiceMode === "off" || gameOver) return;
            let sName = currentServer === 1 ? p1Name : p2Name;
            let sScore = currentServer === 1 ? scoreP1 : scoreP2;
            let rName = currentServer === 1 ? p2Name : p1Name;
            let rScore = currentServer === 1 ? scoreP2 : scoreP1;

            if (voiceMode === "cantonese") {
                let msg = sayPlayerName ? `${sName} ${sScore} 比 ${rName} ${rScore}` : `${sScore} 比 ${rScore}`;
                speak(msg);
            } else {
                let sStr = sScore === 0 ? "Love" : sScore;
                let rStr = rScore === 0 ? "Love" : rScore;
                let msg = (sScore === rScore) ? `${sStr} all` : 
                          (sayPlayerName ? `${sName} ${sStr}, ${rName} ${rStr}` : `${sStr}, ${rStr}`);
                speak(msg);
            }
        }

        function updateServer() {
            let total = scoreP1 + scoreP2;
            let switches = (scoreP1 >= 10 && scoreP2 >= 10) ? (total - 20) : Math.floor(total / 2);
            currentServer = (switches % 2 === 0) ? firstServer : (3 - firstServer);
        }

        function checkGameOver() {
            if ((scoreP1 >= 11 && scoreP2 < 10) || (scoreP2 >= 11 && scoreP1 < 10)) return true;
            if (scoreP1 >= 10 && scoreP2 >= 10 && Math.abs(scoreP1 - scoreP2) >= 2) return true;
            return false;
        }

        function addScore(player, pts = 1, isPenalty = false) {
            if (gameOver || matchOver) return;

            for (let i = 0; i < pts; i++) {
                pointHistory.push(player);
                if (player === 1) scoreP1++; else scoreP2++;
            }

            if (!isPenalty) updateServer();

            if (checkGameOver()) {
                gameOver = true;
                let winner = scoreP1 > scoreP2 ? p1Name : p2Name;
                speak(voiceMode === "english" ? `Game, ${winner} wins game ${currentGame}` : `Game ${currentGame} won by ${winner}`);
                setTimeout(promptNextGame, 500);
            } else {
                announceScore();
                checkWttTrend();
            }
            updateUI();
        }

        function subScore(player) {
            if (gameOver || matchOver) return;
            if (player === 1 && scoreP1 > 0) {
                scoreP1--;
                if (pointHistory.length && pointHistory[pointHistory.length - 1] === 1) pointHistory.pop();
            } else if (player === 2 && scoreP2 > 0) {
                scoreP2--;
                if (pointHistory.length && pointHistory[pointHistory.length - 1] === 2) pointHistory.pop();
            }
            updateServer();
            announceScore();
            updateUI();
        }

        function checkWttTrend() {
            let total = scoreP1 + scoreP2;
            if (total > 0 && total % 4 === 0) {
                let windowSize = total <= 4 ? 4 : (total <= 8 ? 8 : (total <= 16 ? 16 : 32));
                let recent = pointHistory.slice(-windowSize);
                let p1Pts = recent.filter(x => x === 1).length;
                let p2Pts = recent.filter(x => x === 2).length;

                let banner = document.getElementById("wtt-banner");
                banner.innerText = `Last ${recent.length} points : ${p1Name} ${p1Pts} - ${p2Pts} ${p2Name}`;
                banner.style.display = "block";
                setTimeout(() => { banner.style.display = "none"; }, 6000);
            }
        }

        function promptNextGame() {
            let winner = scoreP1 > scoreP2 ? p1Name : p2Name;
            
            let gameDurationSec = Math.floor((Date.now() - gameStartTime) / 1000);
            let gm = Math.floor(gameDurationSec / 60).toString().padStart(2, '0');
            let gs = (gameDurationSec % 60).toString().padStart(2, '0');

            let now = new Date();
            matchHistory.push({
                "Date": now.toISOString().split('T')[0],
                "Start Time": now.toTimeString().split(' ')[0],
                "Duration": `${gm}:${gs}`,
                "Game": `Game ${currentGame}`,
                "Player A": p1Name,
                "Score A": scoreP1,
                "Score B": scoreP2,
                "Player B": p2Name,
                "Winner": winner
            });

            if (scoreP1 > scoreP2) setsP1++; else setsP2++;

            if (setsP1 >= totalSetsToWin || setsP2 >= totalSetsToWin) {
                let finalWinner = setsP1 > setsP2 ? p1Name : p2Name;
                matchOver = true;
                let winBanner = document.getElementById("win-banner");
                winBanner.innerText = `🎉 MATCH WON BY ${finalWinner}!`;
                winBanner.style.display = "block";
                speak(`Match won by ${finalWinner}`);
                alert(`🎉 ${finalWinner} wins the match!`);
                updateUI();
                return;
            }

            let swap = confirm(`${winner} wins Game ${currentGame}!\nSwitch sides for the next game?`);
            let nextFirstServer = 3 - firstServer;

            if (swap) {
                [p1Name, p2Name] = [p2Name, p1Name];
                [p1Item, p2Item] = [p2Item, p1Item];
                [setsP1, setsP2] = [setsP2, setsP1];
                [p1Timeouts, p2Timeouts] = [p2Timeouts, p1Timeouts];
                [p1Challenges, p2Challenges] = [p2Challenges, p1Challenges];
                [p1FoulCount, p2FoulCount] = [p2FoulCount, p1FoulCount];
                [p1Yellow, p2Yellow] = [p2Yellow, p1Yellow];
                [p1Red, p2Red] = [p2Red, p1Red];

                firstServer = 3 - nextFirstServer;
                if (saySwapVoice) speak("Switch sides");
            } else {
                firstServer = nextFirstServer;
            }

            currentServer = firstServer;
            scoreP1 = 0; scoreP2 = 0;
            pointHistory = [];
            currentGame++;
            gameStartTime = Date.now();
            gameOver = false;
            updateUI();
        }

        function issueCard(player, cardType) {
            let pName = player === 1 ? p1Name : p2Name;
            let cardName = cardType === "yellow" ? "Yellow Card" : "Red Card";
            if (!confirm(`Are you sure you want to issue a ${cardName} to ${pName}?`)) return;

            let foulNum = (player === 1) ? ++p1FoulCount : ++p2FoulCount;
            let opponent = player === 1 ? 2 : 1;
            let opponentName = player === 1 ? p2Name : p1Name;

            if (foulNum === 1) {
                alert(`[1st Foul]\n${pName} Official Warning.`);
                speak(`Warning to ${pName}`);
            } else if (foulNum === 2) {
                if (player === 1) p1Yellow++; else p2Yellow++;
                alert(`[2nd Foul]\n${pName} Yellow Card.`);
                speak(`Yellow card to ${pName}`);
            } else if (foulNum === 3) {
                if (player === 1) { p1Yellow++; p1Red++; } else { p2Yellow++; p2Red++; }
                alert(`[3rd Foul]\n${pName} Yellow + Red Card!\nPenalty point to ${opponentName}.`);
                speak(`Penalty point to ${opponentName}`);
                addScore(opponent, 1, true);
            } else if (foulNum === 4) {
                if (player === 1) { p1Yellow++; p1Red++; } else { p2Yellow++; p2Red++; }
                alert(`[4th Foul]\n${pName} Yellow + Red Card!\n2 Penalty points to ${opponentName}.`);
                speak(`Penalty two points to ${opponentName}`);
                addScore(opponent, 2, true);
            } else {
                if (player === 1) p1Red++; else p2Red++;
                alert(`[5th Foul]\n${pName} Disqualified!`);
                gameOver = true; matchOver = true;
                let winBanner = document.getElementById("win-banner");
                winBanner.innerText = `🏆 ${opponentName} wins by disqualification!`;
                winBanner.style.display = "block";
            }
            updateUI();
        }

        function triggerTimeout(player) {
            if (player === 1 && p1Timeouts > 0) { p1Timeouts--; var tName = p1Name; }
            else if (player === 2 && p2Timeouts > 0) { p2Timeouts--; var tName = p2Name; }
            else return;

            document.getElementById("timeout-player-text").innerText = `Requested by: ${tName}`;
            document.getElementById("timeout-overlay").style.display = "flex";
            timeoutRemaining = 60;
            document.getElementById("timeout-timer").innerText = "60s";

            speak(`Timeout called by ${tName}`);

            timeoutInterval = setInterval(() => {
                timeoutRemaining--;
                document.getElementById("timeout-timer").innerText = `${timeoutRemaining}s`;
                if (timeoutRemaining <= 0) finishTimeout();
            }, 1000);
            updateUI();
        }

        function finishTimeout() {
            clearInterval(timeoutInterval);
            document.getElementById("timeout-overlay").style.display = "none";
            speak("Time");
        }

        function useChallenge(player) {
            let pName = player === 1 ? p1Name : p2Name;
            let rem = player === 1 ? p1Challenges : p2Challenges;
            if (rem <= 0) return;

            speak(`Challenge called by ${pName}`);
            let res = confirm(`👁️ ${pName} requested Hawk-Eye Challenge!\nWas the challenge successful?`);

            if (!res) {
                if (player === 1) p1Challenges--; else p2Challenges--;
            }

            let left = player === 1 ? p1Challenges : p2Challenges;
            speak(`${res ? "Challenge successful" : "Challenge unsuccessful"}, ${left} remaining`);
            updateUI();
        }

        function exportExcel() {
            if (matchHistory.length === 0) {
                alert("No match records to export!");
                return;
            }
            let ws = XLSX.utils.json_to_sheet(matchHistory);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Match Records");
            XLSX.writeFile(wb, `TableTennis_Record_${Date.now()}.xlsx`);
        }

        function toggleVoice() {
            let modes = ["english", "cantonese", "off"];
            voiceMode = modes[(modes.indexOf(voiceMode) + 1) % modes.length];
            document.getElementById("btn-voice").innerText = `🔊 Voice: ${voiceMode.toUpperCase()}`;
        }

        function toggleSayName() {
            sayPlayerName = !sayPlayerName;
            document.getElementById("btn-say-name").innerText = `🗣️ Announce Names: ${sayPlayerName ? "ON" : "OFF"}`;
        }

        function toggleSaySwap() {
            saySwapVoice = !saySwapVoice;
            document.getElementById("btn-say-swap").innerText = `🔄 Switch Sides Alert: ${saySwapVoice ? "ON" : "OFF"}`;
        }

        function editPlayerNames() {
            let p1 = prompt("Enter Player 1 Name:", p1Name);
            if (p1) p1Name = p1;
            let p2 = prompt("Enter Player 2 Name:", p2Name);
            if (p2) p2Name = p2;
            updateUI();
        }

        function editSingleName(player) {
            if (player === 1) {
                let p1 = prompt("Enter Player 1 Name:", p1Name);
                if (p1) p1Name = p1;
            } else {
                let p2 = prompt("Enter Player 2 Name:", p2Name);
                if (p2) p2Name = p2;
            }
            updateUI();
        }

        function manualSwitchServe() {
            currentServer = 3 - currentServer;
            firstServer = currentServer;
            speak("Service changed");
            updateUI();
        }

        function togglePause() {
            if (isPaused) {
                accumulatedPauseTime += Date.now() - pauseStartTime;
                isPaused = false;
                document.getElementById("btn-pause").innerText = "⏸️ Pause Timer";
            } else {
                pauseStartTime = Date.now();
                isPaused = true;
                document.getElementById("btn-pause").innerText = "▶️ Resume Timer";
            }
        }

        function renderDisplayButton(btnId, item) {
            let btn = document.getElementById(btnId);
            btn.innerHTML = "";
            if (item.type === 'flag') {
                let img = document.createElement("img");
                img.src = item.url;
                btn.appendChild(img);
            } else {
                btn.innerText = item.value;
            }
        }

        function updateUI() {
            document.getElementById("p1-name-display").innerText = p1Name;
            document.getElementById("p2-name-display").innerText = p2Name;

            renderDisplayButton("p1-emoji-btn", p1Item);
            renderDisplayButton("p2-emoji-btn", p2Item);

            document.getElementById("p1-score-display").innerText = scoreP1;
            document.getElementById("p2-score-display").innerText = scoreP2;

            document.getElementById("game-info").innerText = 
                `Game ${currentGame} (Best of ${bestOfSets}) | Total Games (${setsP1} : ${setsP2})`;

            document.getElementById("p1-serve").className = `serve-badge ${currentServer === 1 && !gameOver ? 'active' : ''}`;
            document.getElementById("p2-serve").className = `serve-badge ${currentServer === 2 && !gameOver ? 'active' : ''}`;

            document.getElementById("p1-timeout-btn").innerText = `⏸️ Timeout (${p1Timeouts})`;
            document.getElementById("p1-timeout-btn").disabled = p1Timeouts <= 0;
            document.getElementById("p1-challenge-btn").innerText = `👁️ Challenge (${p1Challenges})`;
            document.getElementById("p1-challenge-btn").disabled = p1Challenges <= 0;

            document.getElementById("p2-timeout-btn").innerText = `⏸️ Timeout (${p2Timeouts})`;
            document.getElementById("p2-timeout-btn").disabled = p2Timeouts <= 0;
            document.getElementById("p2-challenge-btn").innerText = `👁️ Challenge (${p2Challenges})`;
            document.getElementById("p2-challenge-btn").disabled = p2Challenges <= 0;

            document.getElementById("btn-switch-serve").style.display = (gameOver || matchOver) ? "inline-block" : "none";

            renderCards("p1-cards", p1Yellow, p1Red);
            renderCards("p2-cards", p2Yellow, p2Red);
        }

        function renderCards(containerId, yellow, red) {
            let container = document.getElementById(containerId);
            container.innerHTML = "";
            if (yellow > 0) {
                let div = document.createElement("div");
                div.className = "penalty-card";
                div.style.backgroundColor = "#F5C81E";
                div.innerText = yellow > 1 ? yellow : "";
                container.appendChild(div);
            }
            if (red > 0) {
                let div = document.createElement("div");
                div.className = "penalty-card";
                div.style.backgroundColor = "#EB3232";
                div.style.color = "white";
                div.innerText = red > 1 ? red : "";
                container.appendChild(div);
            }
        }

        setInterval(() => {
            let totalSec = isPaused ? 
                Math.floor((pauseStartTime - matchStartTime - accumulatedPauseTime) / 1000) :
                Math.floor((Date.now() - matchStartTime - accumulatedPauseTime) / 1000);
            
            totalSec = Math.max(0, totalSec);
            let m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            let s = (totalSec % 60).toString().padStart(2, '0');
            document.getElementById("match-timer").innerText = `Time: ${m}:${s} ${isPaused ? '(PAUSED)' : ''}`;
        }, 1000);

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;

            if (e.key === 'ArrowLeft' || e.key === 'a') addScore(1);
            else if (e.key === 'ArrowUp' || e.key === 'w') subScore(1);
            else if (e.key === 'ArrowRight' || e.key === 'd') addScore(2);
            else if (e.key === 'ArrowDown') subScore(2);
            else if (e.key.toLowerCase() === 'p') togglePause();
            else if (e.key.toLowerCase() === 's') manualSwitchServe();
        });

        updateUI();
    </script>
</body>
</html>
