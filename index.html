<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可愛線條狗 乒乓球計分器</title>
  <!-- 引入 SheetJS 用於匯出 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-color: #FAF8F0;
      --card-bg: #FFFFFF;
      --text-color: #282828;
      --p1-color: #FF7878;
      --p2-color: #64B4FF;
      --active-color: #FFC864;
      --serve-color: #FF8C00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      font-family: "Microsoft JhengHei", "PingFang HK", sans-serif;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 28px;
    }

    .sub-title {
      font-size: 18px;
      font-weight: bold;
      color: #555;
    }

    .controls-hint {
      position: absolute;
      right: 0;
      top: 5px;
      font-size: 13px;
      background: #EAE5D9;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid var(--text-color);
    }

    .scoreboard {
      display: flex;
      gap: 30px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      border: 4px solid var(--text-color);
      border-radius: 25px;
      width: 42%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 4px 6px 0px var(--text-color);
      position: relative;
    }

    .serve-indicator {
      position: absolute;
      top: -15px;
      background: var(--serve-color);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      border: 2px solid var(--text-color);
      display: none;
    }

    .card.serving .serve-indicator {
      display: block;
    }

    /* 簡約 SVG 線條狗 */
    .dog-avatar {
      width: 110px;
      height: 90px;
      margin-top: 10px;
    }

    .name-input {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      border: 2px solid var(--text-color);
      border-radius: 10px;
      padding: 5px 10px;
      width: 80%;
      background: #F0F0F0;
      outline: none;
    }

    .name-input:focus {
      background: var(--active-color);
    }

    .score {
      font-size: 85px;
      font-weight: bold;
      margin: 10px 0;
      font-family: Arial, sans-serif;
    }

    .vs-text {
      font-size: 32px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      background: white;
      border: 2px solid var(--text-color);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 3px 0px var(--text-color);
      transition: all 0.1s;
    }

    button:active {
      transform: translate(2px, 3px);
      box-shadow: 0px 0px 0px var(--text-color);
    }

    .winner-banner {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #D93838;
      display: none;
    }

    .action-bar {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏓 乒乓波線條狗計分器</h1>
    <div class="sub-title" id="game-info">第 1 局 | 總勝局數 (0 : 0)</div>
    <div class="controls-hint" id="voice-hint">[V] 語音: 🇭🇰 廣東話 | [E] Excel | [S] 發球權</div>
  </header>

  <div class="scoreboard">
    <!-- 選手 A 卡片 -->
    <div class="card" id="card-p1">
      <div class="serve-indicator">🏓 發球中</div>
      <svg class="dog-avatar" viewBox="0 0 100 80">
        <polygon points="20,25 5,45 25,40" fill="#FF7878" stroke="#282828" stroke-width="3"/>
        <polygon points="80,25 95,45 75,40" fill="#FF7878" stroke="#282828" stroke-width="3"/>
        <ellipse cx="50" cy="45" rx="35" ry="25" fill="#FFFFFF" stroke="#282828" stroke-width="3"/>
        <circle cx="38" cy="42" r="4" fill="#282828"/>
        <circle cx="62" cy="42" r="4" fill="#282828"/>
        <circle cx="50" cy="52" r="5" fill="#282828"/>
      </svg>
      <input type="text" id="p1-name" class="name-input" value="選手 A">
      <div class="score" id="p1-score">0</div>
      <div class="btn-group">
        <button onclick="addScore(1)">+1 (←)</button>
        <button onclick="minusScore(1)">-1</button>
      </div>
    </div>

    <div class="vs-text">VS</div>

    <!-- 選手 B 卡片 -->
    <div class="card" id="card-p2">
      <div class="serve-indicator">🏓 發球中</div>
      <svg class="dog-avatar" viewBox="0 0 100 80">
        <polygon points="20,25 5,45 25,40" fill="#64B4FF" stroke="#282828" stroke-width="3"/>
        <polygon points="80,25 95,45 75,40" fill="#64B4FF" stroke="#282828" stroke-width="3"/>
        <ellipse cx="50" cy="45" rx="35" ry="25" fill="#FFFFFF" stroke="#282828" stroke-width="3"/>
        <circle cx="38" cy="42" r="4" fill="#282828"/>
        <circle cx="62" cy="42" r="4" fill="#282828"/>
        <circle cx="50" cy="52" r="5" fill="#282828"/>
      </svg>
      <input type="text" id="p2-name" class="name-input" value="選手 B">
      <div class="score" id="p2-score">0</div>
      <div class="btn-group">
        <button onclick="addScore(2)">+1 (→)</button>
        <button onclick="minusScore(2)">-1</button>
      </div>
    </div>
  </div>

  <div class="winner-banner" id="winner-banner">🏆 本局獲勝！</div>

  <div class="action-bar">
    <button onclick="nextGame()" id="btn-next" style="display:none; background: #FFC864;">下一局 (Space)</button>
    <button onclick="toggleVoiceMode()">切換語音 (V)</button>
    <button onclick="switchServer()">換發球 (S)</button>
    <button onclick="exportToExcel()">匯出 Excel (E)</button>
  </div>

  <script>
    let scoreP1 = 0, scoreP2 = 0;
    let setsP1 = 0, setsP2 = 0;
    let currentGame = 1;
    let firstServerOfGame = 1;
    let currentServer = 1;
    let matchHistory = [];
    
    // 語音模式: "cantonese", "english", "off"
    let voiceMode = "cantonese";

    function speakText(text) {
      if (voiceMode === "off") return;
      window.speechSynthesis.cancel(); // 停止上一段語音

      const utterance = new SpeechSynthesisUtterance(text);
      if (voiceMode === "cantonese") {
        utterance.lang = "zh-HK"; // 指定廣東話
      } else {
        utterance.lang = "en-US";
      }
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function speakScore() {
      if (voiceMode === "off") return;

      let p1Name = document.getElementById("p1-name").value || "選手 A";
      let p2Name = document.getElementById("p2-name").value || "選手 B";

      let serverName = currentServer === 1 ? p1Name : p2Name;
      let serverScore = currentServer === 1 ? scoreP1 : scoreP2;
      let receiverName = currentServer === 1 ? p2Name : p1Name;
      let receiverScore = currentServer === 1 ? scoreP2 : scoreP1;

      let text = voiceMode === "cantonese"
        ? `${serverName} ${serverScore} 比 ${receiverName} ${receiverScore}`
        : `${serverName} ${serverScore}, ${receiverName} ${receiverScore}`;

      speakText(text);
    }

    function checkGameOver() {
      if ((scoreP1 >= 11 && scoreP2 < 10) || (scoreP2 >= 11 && scoreP1 < 10)) return true;
      if (scoreP1 >= 10 && scoreP2 >= 10 && Math.abs(scoreP1 - scoreP2) >= 2) return true;
      return false;
    }

    function updateServer() {
      let total = scoreP1 + scoreP2;
      let switches = (scoreP1 >= 10 && scoreP2 >= 10) ? (total - 20) : Math.floor(total / 2);
      
      if (switches % 2 === 0) {
        currentServer = firstServerOfGame;
      } else {
        currentServer = 3 - firstServerOfGame;
      }
    }

    function updateUI() {
      document.getElementById("p1-score").innerText = scoreP1;
      document.getElementById("p2-score").innerText = scoreP2;
      document.getElementById("game-info").innerText = `第 ${currentGame} 局 | 總勝局數 (${setsP1} : ${setsP2})`;

      let isOver = checkGameOver();

      // 更新發球標示
      document.getElementById("card-p1").classList.toggle("serving", currentServer === 1 && !isOver);
      document.getElementById("card-p2").classList.toggle("serving", currentServer === 2 && !isOver);

      // 勝負橫幅
      let banner = document.getElementById("winner-banner");
      let btnNext = document.getElementById("btn-next");
      if (isOver) {
        let p1Name = document.getElementById("p1-name").value || "選手 A";
        let p2Name = document.getElementById("p2-name").value || "選手 B";
        let winner = scoreP1 > scoreP2 ? p1Name : p2Name;
        banner.innerText = `🏆 ${winner} 本局獲勝！`;
        banner.style.display = "block";
        btnNext.style.display = "inline-block";
      } else {
        banner.style.display = "none";
        btnNext.style.display = "none";
      }

      // 語音提示狀態
      let voiceStr = voiceMode === "cantonese" ? "🇭🇰 廣東話" : (voiceMode === "english" ? "🇬🇧 英文" : "🔇 關閉");
      document.getElementById("voice-hint").innerText = `[V] 語音: ${voiceStr} | [E] Excel | [S] 發球權`;
    }

    function addScore(player) {
      if (checkGameOver()) return;
      if (player === 1) scoreP1++;
      else scoreP2++;

      updateServer();
      updateUI();
      speakScore();
    }

    function minusScore(player) {
      if (player === 1) scoreP1 = Math.max(0, scoreP1 - 1);
      else scoreP2 = Math.max(0, scoreP2 - 1);

      updateServer();
      updateUI();
      speakScore();
    }

    function switchServer() {
      currentServer = 3 - currentServer;
      updateUI();
      speakScore();
    }

    function toggleVoiceMode() {
      if (voiceMode === "cantonese") voiceMode = "english";
      else if (voiceMode === "english") voiceMode = "off";
      else voiceMode = "cantonese";

      updateUI();
      if (voiceMode !== "off") {
        speakText(voiceMode === "cantonese" ? "廣東話朗讀" : "English Voice");
      }
    }

    function nextGame() {
      if (!checkGameOver()) return;

      let p1Name = document.getElementById("p1-name").value || "選手 A";
      let p2Name = document.getElementById("p2-name").value || "選手 B";
      let winner = scoreP1 > scoreP2 ? p1Name : p2Name;

      matchHistory.push({
        "局數": `第 ${currentGame} 局`,
        "選手 A": p1Name,
        "得分 A": scoreP1,
        "選手 B": p2Name,
        "得分 B": score_P2 = scoreP2,
        "獲勝者": winner,
        "記錄時間": new Date().toLocaleString()
      });

      if (scoreP1 > scoreP2) setsP1++;
      else setsP2++;

      scoreP1 = 0;
      scoreP2 = 0;
      currentGame++;

      firstServerOfGame = 3 - firstServerOfGame;
      currentServer = firstServerOfGame;

      updateUI();
    }

    function exportToExcel() {
      if (matchHistory.length === 0) {
        alert("⚠️ 目前尚無完賽紀錄可匯出！");
        return;
      }

      const worksheet = XLSX.utils.json_to_sheet(matchHistory);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "比賽成績");
      XLSX.writeFile(workbook, `乒乓球比賽成績表_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // 鍵盤快捷鍵監聽
    document.addEventListener("keydown", (e) => {
      if (document.activeElement.tagName === "INPUT") return;

      if (e.key === "ArrowLeft") addScore(1);
      else if (e.key === "ArrowRight") addScore(2);
      else if (e.key === "ArrowDown") minusScore(1);
      else if (e.key === "ArrowUp") minusScore(2);
      else if (e.key === "s" || e.key === "S") switchServer();
      else if (e.key === "v" || e.key === "V") toggleVoiceMode();
      else if (e.key === "e" || e.key === "E") exportToExcel();
      else if (e.key === " " || e.key === "Enter") {
        if (checkGameOver()) nextGame();
      }
    });

    // 初始化 UI
    updateUI();
  </script>
</body>
</html>
